<!DOCTYPE html>
<html lang="es" data-theme="default">
<head>
  <meta charset="UTF-8">
  <style>
    







:root {
  color-scheme: dark;

  --tw-bg: #0e0e10;
  --tw-surface: #18181b;
  --tw-surface-light: #1f1f23;
  --tw-surface-hover: #26262c;
  --tw-surface-hover-light: #2a2a2e;

  --tw-text-primary: #efeff1;
  --tw-text-secondary: #adadb8;
  --tw-text-muted: #57575e;
  --tw-text-inverse: #000000;

  --tw-accent: #9147ff;
  --tw-accent-hover: #a25ceb;
  --tw-accent-light: #a970ff;
  --tw-accent-dark: #6030a8;
  --tw-accent-deep: #1b0b33;
  --tw-accent-gradient: linear-gradient(135deg, #9147ff, #6441a5);
  --tw-accent-glow: rgba(145, 71, 255, 0.25);
  --tw-accent-glow-strong: rgba(145, 71, 255, 0.5);
  --tw-on-accent: #ffffff;
  --tw-border: #3a3a3d;
  --tw-shadow: rgba(0, 0, 0, 0.3);
  --tw-overlay-subtle: rgba(255, 255, 255, 0.03);
  --tw-overlay-hover: rgba(255, 255, 255, 0.04);
  --tw-spinner-border: rgba(255, 255, 255, 0.3);
  --tw-ambient-text-shadow: rgba(0, 0, 0, 0.9);

  --tw-live: #eb0400;
  --tw-danger: #e91916;
  --tw-danger-hover: #ff6b6b;
  --tw-error-text: #f87171;
  --tw-error-bg: rgba(235, 4, 0, 0.12);
  --tw-error-border: rgba(235, 4, 0, 0.3);
  --tw-warning: #f5c518;
  --tw-warning-bg: rgba(245, 197, 24, 0.08);
  --tw-warning-border: rgba(245, 197, 24, 0.2);
  --tw-warning-hover-bg: rgba(245, 197, 24, 0.18);
  --tw-warning-hover-border: rgba(245, 197, 24, 0.5);

  --tw-offline: #555555;
  --tw-offline-dark: #333333;
  --tw-offline-gradient: linear-gradient(135deg, #555555, #333333);

  --tw-font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --tw-font-size-base: 13px;
  --tw-font-size-title: 14px;
}

[data-theme="gx"] {
  --tw-bg: #06070d;
  --tw-surface: #10121a;
  --tw-gx-panel: #1d1d1d;
  --tw-surface-light: #181b26;
  --tw-surface-hover: #1f2230;
  --tw-surface-hover-light: #282c3f;

  --tw-text-primary: #ffffff;
  --tw-text-secondary: #9da3b4;
  --tw-text-muted: #626779;
  --tw-text-inverse: #000000;

  --tw-accent: #fa1e4e;
  --tw-accent-hover: #ff3b68;
  --tw-accent-light: #fa1e4e;
  --tw-accent-dark: #a01231;
  --tw-accent-deep: #1f060b;
  --tw-accent-gradient: linear-gradient(135deg, #fa1e4e, #a01231);
  --tw-accent-glow: rgba(250, 30, 78, 0.35);
  --tw-accent-glow-strong: rgba(250, 30, 78, 0.6);
  --tw-on-accent: #ffffff;
  --tw-border: var(--tw-accent-dark);
  --tw-shadow: rgba(0, 0, 0, 0.7);
  --tw-overlay-subtle: color-mix(in srgb, var(--tw-accent) 5%, transparent);
  --tw-overlay-hover: color-mix(in srgb, var(--tw-accent) 12%, transparent);
  --tw-spinner-border: color-mix(in srgb, var(--tw-accent) 25%, transparent);
  --tw-ambient-text-shadow: rgba(0, 0, 0, 0.95);

  --tw-live: #fa1e4e;
  --tw-danger: #fa1e4e;
  --tw-danger-hover: #ff3b68;
  --tw-error-text: #ff6b6b;
  --tw-error-bg: rgba(250, 30, 78, 0.15);
  --tw-error-border: rgba(250, 30, 78, 0.4);
  --tw-warning: #ffb800;
  --tw-warning-bg: rgba(255, 184, 0, 0.1);
  --tw-warning-border: rgba(255, 184, 0, 0.3);
  --tw-warning-hover-bg: rgba(255, 184, 0, 0.2);
  --tw-warning-hover-border: rgba(255, 184, 0, 0.5);

  --tw-offline: #444754;
  --tw-offline-dark: #22242c;
  --tw-offline-gradient: linear-gradient(135deg, #444754, #22242c);

  --tw-font-family: "Zen Dots", sans-serif;
  --tw-font-size-base: 13px;
  --tw-font-size-title: 14px;
}

body {
  margin: 0;
  padding: 0;
  font-family: var(--tw-font-family);
  background-color: var(--tw-bg);
  color: var(--tw-text-primary);
  color-scheme: dark;
}

input,
button,
select,
textarea {
  font-family: inherit;
}

* {
  box-sizing: border-box;
}

/* Firefox uses the standard scrollbar properties. */
html {
  color-scheme: dark;
  scrollbar-width: thin;
  scrollbar-color: var(--tw-surface-light) var(--tw-bg);
}

:focus-visible {
  outline: 2px solid var(--tw-accent);
  outline-offset: 2px;
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--tw-bg);
}

::-webkit-scrollbar-thumb {
  background: var(--tw-surface-light);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--tw-text-muted);
}

[data-theme="gx"] html,
html[data-theme="gx"] {
  scrollbar-color: var(--tw-accent-dark) var(--tw-bg);
}

[data-theme="gx"] ::-webkit-scrollbar-thumb {
  background: var(--tw-accent-dark);
}

[data-theme="gx"] ::-webkit-scrollbar-thumb:hover {
  background: var(--tw-accent);
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}


.main-root, .notif-root, .themes-root, .settings-root {
  width: 100%;
  min-height: auto;
  background: var(--tw-bg);
  color: var(--tw-text-primary);
  font-family: var(--tw-font-family);
  display: flex;
  flex-direction: column;
}

.main-header,
.notif-header,
.themes-header,
.settings-header {
  display: flex;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid var(--tw-surface-light);
  background: var(--tw-surface);
  flex-shrink: 0;
}

[data-theme="gx"] .main-header,
[data-theme="gx"] .settings-header {
  border-bottom: 2px solid transparent;
  background:
    linear-gradient(to right, var(--tw-accent), var(--tw-accent-deep)) bottom / 100% 2px no-repeat,
    var(--tw-surface);
}

.main-settings-btn,
.notif-back-btn,
.themes-back-btn,
.settings-back-btn {
  background: none;
  border: none;
  color: var(--tw-text-secondary);
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  flex-shrink: 0;
  transition:
    color 0.15s,
    background 0.15s;
}

.main-settings-btn:hover,
.notif-back-btn:hover,
.themes-back-btn:hover,
.settings-back-btn:hover {
  color: var(--tw-text-primary);
  background: var(--tw-surface-hover);
}

[data-theme="gx"] .main-settings-btn,
[data-theme="gx"] .settings-back-btn {
  color: var(--tw-accent);
}

[data-theme="gx"] .main-settings-btn:hover,
[data-theme="gx"] .settings-back-btn:hover {
  color: var(--tw-text-primary);
  background: color-mix(in srgb, var(--tw-accent) 20%, transparent);
}

.notif-header-title,
.themes-header-title,
.settings-header-title {
  font-weight: 700;
  font-size: 14px;
  color: var(--tw-text-primary);
  flex: 1;
}

.session-spinner,
.notif-spinner,
.settings-spinner {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 3px solid var(--tw-surface-light);
  border-top-color: var(--tw-accent);
  animation: spin 0.8s linear infinite;
}

    .settings-root {
  background: linear-gradient(
    to bottom,
    var(--profile-tint, var(--tw-bg)) 0%,
    var(--profile-dark, var(--tw-bg)) 50%,
    var(--tw-bg) 100%
  );
}

.settings-header {
  gap: 12px;
}

.settings-profile {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 20px 24px;
  gap: 14px;
}

.settings-avatar-wrap {
  position: relative;
  width: 200px;
  height: 200px;
  border-radius: 5%;
  overflow: hidden;
  box-shadow: 0 4px 10px var(--tw-shadow);
}

.settings-avatar {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.settings-avatar-placeholder {
  width: 100%;
  height: 100%;
  background: var(--tw-surface-hover);
  border-radius: 50%;
  border: 3px solid var(--tw-border);
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%,
  100% {
    opacity: 0.6;
  }
  50% {
    opacity: 1;
  }
}

.settings-username {
  font-size: 18px;
  font-weight: 700;
  color: var(--tw-text-primary);
}

.settings-login {
  font-size: 13px;
  color: var(--tw-text-secondary);
  margin-top: -8px;
}

.settings-section {
  padding: 0 16px;
  margin-top: auto;
}

.settings-section--spaced {
  margin-top: 16px;
}

.settings-item-row,
.settings-item-value-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.settings-item-value-row {
  gap: 6px;
}

.settings-chevron {
  color: var(--tw-text-secondary);
  flex-shrink: 0;
}

.settings-stack {
  display: flex;
  flex-direction: column;
}

.settings-file-input {
  display: none;
}

.settings-section-title {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--tw-text-secondary);
  padding: 0 0 8px;
}

.settings-info-list {
  background: var(--tw-surface);
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--tw-surface-light);
}

.settings-info-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  font-size: 13px;
}

.settings-info-item + .settings-info-item {
  border-top: 1px solid var(--tw-surface-light);
}

.settings-info-item--clickable {
  width: 100%;
  border: none;
  background: transparent;
  font-family: inherit;
  text-align: start;
  cursor: pointer;
  transition: background 0.15s;
  user-select: none;
}

.settings-info-item--clickable:hover {
  background: var(--tw-overlay-hover);
}

.settings-info-label {
  color: var(--tw-text-secondary);
  text-align: start;
}

.settings-info-item--preference {
  gap: 12px;
}

.settings-preference-copy {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.settings-preference-hint {
  font-size: 11px;
  line-height: 1.4;
  color: var(--tw-text-secondary);
}

.settings-info-item--preference select {
  flex-shrink: 0;
}

.settings-toggle:disabled,
.settings-lang-select:disabled {
  opacity: 0.6;
  cursor: wait;
}

.settings-info-value {
  color: var(--tw-text-primary);
  font-weight: 500;
}

.settings-lang-select {
  background: var(--tw-surface-hover);
  color: var(--tw-text-primary);
  border: 1px solid var(--tw-border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  font-family: var(--tw-font-family);
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s;
}

.settings-lang-select:hover,
.settings-lang-select:focus {
  border-color: var(--tw-accent);
}

.settings-toggle {
  position: relative;
  width: 42px;
  height: 24px;
  background: var(--tw-border);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
  transition: background 0.2s ease;
}

.settings-toggle--on {
  background: var(--tw-accent);
}

.settings-toggle-knob {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  background: var(--tw-text-primary);
  border-radius: 50%;
  transition: transform 0.2s ease;
  pointer-events: none;
}

.settings-toggle--on .settings-toggle-knob {
  transform: translateX(18px);
}

.settings-logout-section {
  padding: 24px 16px;
  margin-top: 10px;
}

.settings-logout-btn {
  width: 100%;
  padding: 12px;
  background-color: var(--tw-danger);
  color: var(--tw-on-accent);
  font-size: 14px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition:
    background 0.15s,
    color 0.15s;
  border: none;
}

.settings-logout-btn:hover {
  background-color: var(--tw-danger-hover);
  color: var(--tw-on-accent);
}

.settings-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 48px 0;
}

[data-theme="gx"] .settings-section-title {
  color: var(--tw-accent);
  font-size: 11.5px;
  letter-spacing: 0.06em;
}

[data-theme="gx"] .settings-info-list {
  background: var(--tw-surface);
  border: 1px solid color-mix(in srgb, var(--tw-accent-dark) 50%, transparent);
  border-radius: 4px;
}

[data-theme="gx"] .settings-info-item + .settings-info-item {
  border-top: 1px solid color-mix(in srgb, var(--tw-accent-dark) 25%, transparent);
}

[data-theme="gx"] .settings-lang-select {
  background: var(--tw-gx-panel);
  border: 1px solid color-mix(in srgb, var(--tw-accent-dark) 60%, transparent);
  border-radius: 3px;
  color: var(--tw-text-primary);
}

[data-theme="gx"] .settings-lang-select:hover,
[data-theme="gx"] .settings-lang-select:focus {
  border-color: var(--tw-accent);
  box-shadow: 0 0 8px var(--tw-accent-glow);
}

[data-theme="gx"] .settings-toggle--on {
  background: var(--tw-accent);
}

[data-theme="gx"] .settings-logout-btn {
  background: var(--tw-danger);
  border-radius: 3px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  box-shadow: 0 2px 10px color-mix(in srgb, var(--tw-danger) 30%, transparent);
}

[data-theme="gx"] .settings-logout-btn:hover {
  background: var(--tw-danger-hover);
}

.settings-backup-group {
  display: flex;
  gap: 10px;
  margin: 4px 0 6px;
}

.settings-backup-btn {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  color: var(--tw-text-primary);
  background: var(--tw-surface);
  border: 1px solid var(--tw-border);
  border-radius: 5px;
  cursor: pointer;
  user-select: none;
  transition:
    background 0.15s,
    border-color 0.15s,
    transform 0.1s,
    box-shadow 0.15s;
}

.settings-backup-btn:hover {
  background: var(--tw-surface-hover);
  border-color: var(--tw-accent);
  transform: translateY(-1px);
}

.settings-backup-btn:active {
  transform: translateY(0);
}

.settings-backup-btn:disabled {
  opacity: 0.6;
  cursor: wait;
}

.settings-backup-feedback {
  font-size: 11px;
  padding: 6px 10px;
  border-radius: 4px;
  margin-top: 6px;
  background: color-mix(in srgb, var(--tw-accent) 15%, transparent);
  color: var(--tw-text-primary);
  border: 1px solid var(--tw-accent-glow);
}

[data-theme="gx"] .settings-backup-btn {
  background: var(--tw-surface);
  border: 1px solid color-mix(in srgb, var(--tw-accent-dark) 60%, transparent);
  border-radius: 2px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
}

[data-theme="gx"] .settings-backup-btn:hover {
  background: var(--tw-surface-hover);
  border-color: var(--tw-accent);
  box-shadow: 0 0 8px var(--tw-accent-glow);
}

    html, body {
      margin: 0;
      padding: 0;
      background: var(--tw-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--tw-text-primary);
      width: 360px;
      overflow-x: hidden;
    }
  </style>
</head>
<body>

  
<div class="settings-root">
  <header class="settings-header">
    <button class="settings-back-btn" aria-label="Volver">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
      </svg>
    </button>
    <span class="settings-header-title">Ajustes</span>
  </header>
  <div class="settings-profile">
    <div class="settings-avatar-wrap">
      <svg width="200" height="200" viewBox="0 0 200 200"><defs><linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#9147ff"/><stop offset="100%" stop-color="#4a00e0"/></linearGradient></defs><rect width="200" height="200" fill="url(#pbg)"/><circle cx="100" cy="80" r="42" fill="#fff" opacity="0.95"/><ellipse cx="100" cy="180" rx="70" ry="45" fill="#fff" opacity="0.95"/></svg>
    </div>
    <div class="settings-username">TheLouisXD</div>
    <div class="settings-login">thelouisxd • 1.2K seguidores</div>
  </div>

  <div class="settings-section settings-section--spaced">
    <div class="settings-section-title">PREFERENCIAS</div>
    <div class="settings-info-list">
      <div class="settings-info-item">
        <span class="settings-info-label">Idioma</span>
        <select class="settings-lang-select">
          <option selected>Español</option>
          <option>English</option>
        </select>
      </div>
      <button class="settings-info-item settings-info-item--clickable">
        <span class="settings-item-row">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--tw-text-secondary)" stroke-width="2.2">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 2a10 10 0 0 1 0 20v-20z" fill="var(--tw-text-secondary)" />
          </svg>
          <span class="settings-info-label">Tema</span>
        </span>
        <div class="settings-item-value-row">
          <span class="settings-preference-hint">Por defecto</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="settings-chevron">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z" />
          </svg>
        </div>
      </button>
      <div class="settings-info-item">
        <div class="settings-stack">
          <span class="settings-info-label">Mostrar desconectados</span>
          <span class="settings-info-label" style="font-size:11px;opacity:0.7">Canales que sigues pero no emiten</span>
        </div>
        <button class="settings-toggle settings-toggle--on">
          <span class="settings-toggle-knob"></span>
        </button>
      </div>
      <div class="settings-info-item settings-info-item--preference">
        <div class="settings-preference-copy">
          <span class="settings-info-label">Frecuencia de actualización</span>
          <span class="settings-preference-hint">Intervalo entre comprobaciones</span>
        </div>
        <select class="settings-lang-select">
          <option selected>1 minuto</option>
          <option>2 minutos</option>
          <option>5 minutos</option>
        </select>
      </div>
      <div class="settings-info-item settings-info-item--preference">
        <div class="settings-preference-copy">
          <span class="settings-info-label">Recordar sesión</span>
          <span class="settings-preference-hint">Mantener conectado al cerrar</span>
        </div>
        <button class="settings-toggle settings-toggle--on">
          <span class="settings-toggle-knob"></span>
        </button>
      </div>
      <button class="settings-info-item settings-info-item--clickable">
        <span class="settings-item-row">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--tw-text-secondary)" stroke-width="2.2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
          </svg>
          <span class="settings-info-label">Notificaciones</span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="settings-chevron">
          <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z" />
        </svg>
      </button>
    </div>
  </div>

  <div class="settings-section settings-section--spaced">
    <div class="settings-section-title">COPIA DE SEGURIDAD</div>
    <div class="settings-backup-group">
      <button class="settings-backup-btn">Importar</button>
      <button class="settings-backup-btn">Exportar</button>
    </div>
    <div class="settings-backup-feedback">✓ Copia exportada correctamente</div>
  </div>

  <div class="settings-logout-section">
    <button class="settings-logout-btn">Cerrar sesión</button>
  </div>
</div>


</body>
</html>
