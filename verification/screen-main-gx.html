<!DOCTYPE html>
<html lang="es" data-theme="gx">
<head>
  <meta charset="UTF-8">
  <style>
    







:root {
  color-scheme: dark;

  --tw-bg: #0e0e10;
  --tw-surface: #18181b;
  --tw-surface-light: #1f1f23;
  --tw-surface-hover: #26262c;
  --tw-surface-hover-light: #2a2a2e;

  --tw-text-primary: #efeff1;
  --tw-text-secondary: #adadb8;
  --tw-text-muted: #57575e;
  --tw-text-inverse: #000000;

  --tw-accent: #9147ff;
  --tw-accent-hover: #a25ceb;
  --tw-accent-light: #a970ff;
  --tw-accent-dark: #6030a8;
  --tw-accent-deep: #1b0b33;
  --tw-accent-gradient: linear-gradient(135deg, #9147ff, #6441a5);
  --tw-accent-glow: rgba(145, 71, 255, 0.25);
  --tw-accent-glow-strong: rgba(145, 71, 255, 0.5);
  --tw-on-accent: #ffffff;
  --tw-border: #3a3a3d;
  --tw-shadow: rgba(0, 0, 0, 0.3);
  --tw-overlay-subtle: rgba(255, 255, 255, 0.03);
  --tw-overlay-hover: rgba(255, 255, 255, 0.04);
  --tw-spinner-border: rgba(255, 255, 255, 0.3);
  --tw-ambient-text-shadow: rgba(0, 0, 0, 0.9);

  --tw-live: #eb0400;
  --tw-danger: #e91916;
  --tw-danger-hover: #ff6b6b;
  --tw-error-text: #f87171;
  --tw-error-bg: rgba(235, 4, 0, 0.12);
  --tw-error-border: rgba(235, 4, 0, 0.3);
  --tw-warning: #f5c518;
  --tw-warning-bg: rgba(245, 197, 24, 0.08);
  --tw-warning-border: rgba(245, 197, 24, 0.2);
  --tw-warning-hover-bg: rgba(245, 197, 24, 0.18);
  --tw-warning-hover-border: rgba(245, 197, 24, 0.5);

  --tw-offline: #555555;
  --tw-offline-dark: #333333;
  --tw-offline-gradient: linear-gradient(135deg, #555555, #333333);

  --tw-font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --tw-font-size-base: 13px;
  --tw-font-size-title: 14px;
}

[data-theme="gx"] {
  --tw-bg: #06070d;
  --tw-surface: #10121a;
  --tw-gx-panel: #1d1d1d;
  --tw-surface-light: #181b26;
  --tw-surface-hover: #1f2230;
  --tw-surface-hover-light: #282c3f;

  --tw-text-primary: #ffffff;
  --tw-text-secondary: #9da3b4;
  --tw-text-muted: #626779;
  --tw-text-inverse: #000000;

  --tw-accent: #fa1e4e;
  --tw-accent-hover: #ff3b68;
  --tw-accent-light: #fa1e4e;
  --tw-accent-dark: #a01231;
  --tw-accent-deep: #1f060b;
  --tw-accent-gradient: linear-gradient(135deg, #fa1e4e, #a01231);
  --tw-accent-glow: rgba(250, 30, 78, 0.35);
  --tw-accent-glow-strong: rgba(250, 30, 78, 0.6);
  --tw-on-accent: #ffffff;
  --tw-border: var(--tw-accent-dark);
  --tw-shadow: rgba(0, 0, 0, 0.7);
  --tw-overlay-subtle: color-mix(in srgb, var(--tw-accent) 5%, transparent);
  --tw-overlay-hover: color-mix(in srgb, var(--tw-accent) 12%, transparent);
  --tw-spinner-border: color-mix(in srgb, var(--tw-accent) 25%, transparent);
  --tw-ambient-text-shadow: rgba(0, 0, 0, 0.95);

  --tw-live: #fa1e4e;
  --tw-danger: #fa1e4e;
  --tw-danger-hover: #ff3b68;
  --tw-error-text: #ff6b6b;
  --tw-error-bg: rgba(250, 30, 78, 0.15);
  --tw-error-border: rgba(250, 30, 78, 0.4);
  --tw-warning: #ffb800;
  --tw-warning-bg: rgba(255, 184, 0, 0.1);
  --tw-warning-border: rgba(255, 184, 0, 0.3);
  --tw-warning-hover-bg: rgba(255, 184, 0, 0.2);
  --tw-warning-hover-border: rgba(255, 184, 0, 0.5);

  --tw-offline: #444754;
  --tw-offline-dark: #22242c;
  --tw-offline-gradient: linear-gradient(135deg, #444754, #22242c);

  --tw-font-family: "Zen Dots", sans-serif;
  --tw-font-size-base: 13px;
  --tw-font-size-title: 14px;
}

body {
  margin: 0;
  padding: 0;
  font-family: var(--tw-font-family);
  background-color: var(--tw-bg);
  color: var(--tw-text-primary);
  color-scheme: dark;
}

input,
button,
select,
textarea {
  font-family: inherit;
}

* {
  box-sizing: border-box;
}

/* Firefox uses the standard scrollbar properties. */
html {
  color-scheme: dark;
  scrollbar-width: thin;
  scrollbar-color: var(--tw-surface-light) var(--tw-bg);
}

:focus-visible {
  outline: 2px solid var(--tw-accent);
  outline-offset: 2px;
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--tw-bg);
}

::-webkit-scrollbar-thumb {
  background: var(--tw-surface-light);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--tw-text-muted);
}

[data-theme="gx"] html,
html[data-theme="gx"] {
  scrollbar-color: var(--tw-accent-dark) var(--tw-bg);
}

[data-theme="gx"] ::-webkit-scrollbar-thumb {
  background: var(--tw-accent-dark);
}

[data-theme="gx"] ::-webkit-scrollbar-thumb:hover {
  background: var(--tw-accent);
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}


.main-root, .notif-root, .themes-root, .settings-root {
  width: 100%;
  min-height: auto;
  background: var(--tw-bg);
  color: var(--tw-text-primary);
  font-family: var(--tw-font-family);
  display: flex;
  flex-direction: column;
}

.main-header,
.notif-header,
.themes-header,
.settings-header {
  display: flex;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid var(--tw-surface-light);
  background: var(--tw-surface);
  flex-shrink: 0;
}

[data-theme="gx"] .main-header,
[data-theme="gx"] .settings-header {
  border-bottom: 2px solid transparent;
  background:
    linear-gradient(to right, var(--tw-accent), var(--tw-accent-deep)) bottom / 100% 2px no-repeat,
    var(--tw-surface);
}

.main-settings-btn,
.notif-back-btn,
.themes-back-btn,
.settings-back-btn {
  background: none;
  border: none;
  color: var(--tw-text-secondary);
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  flex-shrink: 0;
  transition:
    color 0.15s,
    background 0.15s;
}

.main-settings-btn:hover,
.notif-back-btn:hover,
.themes-back-btn:hover,
.settings-back-btn:hover {
  color: var(--tw-text-primary);
  background: var(--tw-surface-hover);
}

[data-theme="gx"] .main-settings-btn,
[data-theme="gx"] .settings-back-btn {
  color: var(--tw-accent);
}

[data-theme="gx"] .main-settings-btn:hover,
[data-theme="gx"] .settings-back-btn:hover {
  color: var(--tw-text-primary);
  background: color-mix(in srgb, var(--tw-accent) 20%, transparent);
}

.notif-header-title,
.themes-header-title,
.settings-header-title {
  font-weight: 700;
  font-size: 14px;
  color: var(--tw-text-primary);
  flex: 1;
}

.session-spinner,
.notif-spinner,
.settings-spinner {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 3px solid var(--tw-surface-light);
  border-top-color: var(--tw-accent);
  animation: spin 0.8s linear infinite;
}

    .main-header {
  justify-content: space-between;
}

.main-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 14px;
  color: var(--tw-accent-light);
}

.main-reload-drawer {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  transform: translateY(-100%);
  pointer-events: none;
  flex-shrink: 0;
  transition:
    grid-template-rows 0.28s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 0.24s ease,
    transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}

.main-reload-drawer--open {
  grid-template-rows: 1fr;
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.main-reload-inner {
  overflow: hidden;
}

.main-reload-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--tw-surface-light);
  background: var(--tw-surface);
}

.main-reload-content .spinner {
  font-size: 20px;
}

.main-reload-text {
  color: var(--tw-text-secondary);
  font-size: 12.5px;
  font-weight: 500;
}

@media (prefers-reduced-motion: reduce) {
  .main-reload-drawer {
    transform: none;
    transition-duration: 0.1s;
  }
}

.spinner {
  font-size: 48px;
  position: relative;
  display: inline-block;
  width: 1em;
  height: 1em;
  flex-shrink: 0;
}

.spinner .spinner-blade {
  position: absolute;
  left: 0.4629em;
  bottom: 0;
  width: 0.074em;
  height: 0.2777em;
  border-radius: 0.0555em;
  background-color: transparent;
  transform-origin: center -0.2222em;
  animation: spinner-fade 1s infinite linear;
}

.spinner .spinner-blade:nth-child(1) {
  animation-delay: 0s;
  transform: rotate(0deg);
}

.spinner .spinner-blade:nth-child(2) {
  animation-delay: 0.083s;
  transform: rotate(30deg);
}

.spinner .spinner-blade:nth-child(3) {
  animation-delay: 0.166s;
  transform: rotate(60deg);
}

.spinner .spinner-blade:nth-child(4) {
  animation-delay: 0.249s;
  transform: rotate(90deg);
}

.spinner .spinner-blade:nth-child(5) {
  animation-delay: 0.332s;
  transform: rotate(120deg);
}

.spinner .spinner-blade:nth-child(6) {
  animation-delay: 0.415s;
  transform: rotate(150deg);
}

.spinner .spinner-blade:nth-child(7) {
  animation-delay: 0.498s;
  transform: rotate(180deg);
}

.spinner .spinner-blade:nth-child(8) {
  animation-delay: 0.581s;
  transform: rotate(210deg);
}

.spinner .spinner-blade:nth-child(9) {
  animation-delay: 0.664s;
  transform: rotate(240deg);
}

.spinner .spinner-blade:nth-child(10) {
  animation-delay: 0.747s;
  transform: rotate(270deg);
}

.spinner .spinner-blade:nth-child(11) {
  animation-delay: 0.83s;
  transform: rotate(300deg);
}

.spinner .spinner-blade:nth-child(12) {
  animation-delay: 0.913s;
  transform: rotate(330deg);
}

@keyframes spinner-fade {
  0% {
    background-color: #69717d;
  }
  100% {
    background-color: transparent;
  }
}

.main-error-banner {
  margin: 10px 12px 0;
  background: var(--tw-error-bg);
  border: 1px solid var(--tw-error-border);
  color: var(--tw-error-text);
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 12px;
}

.main-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  transform: translateY(0);
  opacity: 1;
  transition:
    transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 0.24s ease;
}

@starting-style {
  .main-center {
    transform: translateY(-24px);
    opacity: 0;
  }
}

.main-loading-text {
  color: var(--tw-text-secondary);
  font-size: 13px;
}

.main-section-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px 6px;
}

.main-section-row--favorites {
  margin-top: 2px;
}

.main-section-title {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--tw-text-secondary);
}

.main-badge {
  background: var(--tw-accent);
  color: var(--tw-on-accent);
  font-size: 11px;
  font-weight: 700;
  border-radius: 20px;
  padding: 1px 7px;
  line-height: 16px;
}

.main-badge--favorites {
  background: var(--tw-warning);
  color: #18181b;
}

.main-badge--offline {
  background: var(--tw-border);
  color: var(--tw-text-secondary);
}

.main-scroll {
  flex: 1;
  overflow-y: auto;
  padding-bottom: 16px;
}

.main-live-section {
  margin-top: 4px;
}

.main-section-row--offline {
  margin-top: 8px;
  border-top: 1px solid var(--tw-surface-light);
  padding-top: 14px;
}

.main-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 4px 10px 12px;
  align-content: start;
}

@media (min-width: 480px) {
  .main-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

[data-theme="gx"] .main-logo {
  color: var(--tw-accent);
  font-size: 15px;
  letter-spacing: 0.04em;
}

[data-theme="gx"] .main-logo svg {
  fill: var(--tw-accent);
}

[data-theme="gx"] .main-section-title {
  color: var(--tw-accent);
  font-size: 12px;
  letter-spacing: 0.06em;
}

[data-theme="gx"] .main-badge {
  background: var(--tw-accent);
  color: var(--tw-on-accent);
  border-radius: 4px;
  font-size: 11px;
  line-height: 16px;
  padding: 1px 7px;
}

[data-theme="gx"] .main-badge--favorites {
  background: var(--tw-warning);
  color: #06070d;
  border-radius: 4px;
  font-size: 11px;
  line-height: 16px;
  padding: 1px 7px;
}

[data-theme="gx"] .main-badge--offline {
  background: #2b2e3f;
  color: #9da3b4;
}

[data-theme="gx"] .main-section-row--favorites {
  margin-top: 2px;
}

[data-theme="gx"] .main-section-row--offline {
  border-top: 1px solid color-mix(in srgb, var(--tw-accent-dark) 35%, transparent);
}

.search-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 10px 10px;
  flex-shrink: 0;
}

.search-bar-input {
  flex: 1;
  background: var(--tw-surface);
  border: 1px solid var(--tw-surface-hover-light);
  border-radius: 3px;
  color: var(--tw-text-primary);
  font-size: 13px;
  padding: 10px 10px;
  outline: none;
  font-family: inherit;
  transition: border-color 0.15s;
}

.search-bar-input::placeholder {
  color: var(--tw-text-muted);
}

.search-bar-input:focus {
  border-color: var(--tw-accent);
}

[data-theme="gx"] .search-bar-input {
  border-radius: 3px;
  border: 1px solid transparent;
  background:
    linear-gradient(var(--tw-gx-panel), var(--tw-gx-panel)) padding-box,
    linear-gradient(to right, var(--tw-accent-dark), var(--tw-accent-deep)) border-box;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
  color: var(--tw-text-primary);
}

[data-theme="gx"] .search-bar-input:focus {
  border-color: transparent;
  background:
    linear-gradient(var(--tw-gx-panel), var(--tw-gx-panel)) padding-box,
    linear-gradient(to right, var(--tw-accent), var(--tw-accent-dark)) border-box;
}

.tc-card {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  background: var(--tw-surface);
  border: 1px solid var(--tw-surface-light);
  transition:
    transform 0.15s,
    box-shadow 0.15s,
    border-color 0.15s;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}

.tc-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px var(--tw-shadow);
  border-color: var(--tw-surface-hover-light);
}

.tc-card:active {
  transform: translateY(0);
}

/* Enlace a todo el card para navegación accesible y click primario. */
.tc-channel-link {
  position: absolute;
  inset: 0;
  z-index: 1;
  text-decoration: none;
  cursor: pointer;
  border-radius: inherit;
}

.tc-card:focus-within {
  outline: 2px solid var(--tw-accent);
  outline-offset: 2px;
}

.tc-card--offline {
  opacity: 0.65;
}

.tc-card--offline:hover {
  opacity: 0.9;
  border-color: var(--tw-border);
}

.tc-avatar-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: var(--tw-surface-light);
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
  pointer-events: none;
}

.tc-avatar {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: filter 0.2s;
}

.tc-avatar--offline {
  filter: grayscale(100%);
}

.tc-avatar-fallback {
  width: 100%;
  height: 100%;
  background: var(--tw-accent-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 700;
  color: var(--tw-on-accent);
}

.tc-avatar-fallback--offline {
  background: var(--tw-offline-gradient);
}

.tc-info {
  position: relative;
  z-index: 2;
  pointer-events: none;
  isolation: isolate;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px 6px 7px;
}

/* Mask the container so flipping its image keeps the fade direction intact. */
.tc-ambient {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
}

.tc-ambient-image {
  position: absolute;
  inset: -20%;
  width: 140%;
  height: 140%;
  object-fit: cover;
  object-position: center bottom;
  transform: scaleY(-1);
  filter: blur(8px) saturate(1.2);
  opacity: 0.85;
}

.tc-info--ambient > :not(.tc-ambient) {
  text-shadow: 0 1px 3px var(--tw-ambient-text-shadow);
}

.tc-name-row {
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 0;
}

.tc-name {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  font-weight: 700;
  color: var(--tw-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* The star button stays clickable above the full-card channel link. */
.tc-star-btn {
  pointer-events: auto;
  position: relative;
  z-index: 2;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  min-inline-size: 24px;
  min-block-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border-radius: 4px;
  opacity: 0.5;
  transition:
    opacity 0.15s,
    transform 0.15s,
    background 0.15s;
  line-height: 0;
}

.tc-card:hover .tc-star-btn,
.tc-star-btn:focus-visible,
.tc-star-btn--active {
  opacity: 1;
}

.tc-star-btn:hover {
  transform: scale(1.25);
  background: var(--tw-overlay-hover);
}

.tc-star-btn:focus-visible {
  outline: 2px solid var(--tw-accent-light);
  outline-offset: -1px;
}

.tc-game {
  font-size: 10.5px;
  color: var(--tw-text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tc-viewers {
  font-size: 10.5px;
  color: var(--tw-text-secondary);
}

.tc-offline-label {
  font-size: 10.5px;
  color: var(--tw-text-muted);
}

[data-theme="gx"] .tc-card {
  border-radius: 2px;
  border: 1px solid transparent;
  background:
    linear-gradient(var(--tw-gx-panel), var(--tw-gx-panel)) padding-box,
    linear-gradient(var(--tw-accent-dark), var(--tw-accent-deep)) border-box;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
}

[data-theme="gx"] .tc-card:not(.tc-card--offline):hover {
  background:
    linear-gradient(var(--tw-gx-panel), var(--tw-gx-panel)) padding-box,
    linear-gradient(var(--tw-accent), var(--tw-accent-dark)) border-box;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--tw-accent) 40%, transparent);
}

[data-theme="gx"] .tc-name {
  font-size: 11.5px;
}

[data-theme="gx"] .tc-game {
  font-size: 10px;
}

[data-theme="gx"] .tc-viewers {
  font-size: 10px;
}

    html, body {
      margin: 0;
      padding: 0;
      background: var(--tw-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--tw-text-primary);
      width: 360px;
      overflow-x: hidden;
    }
  </style>
</head>
<body>

  
<div class="main-root">
  <header class="main-header">
